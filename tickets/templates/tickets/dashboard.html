{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Управление заявками</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
</head>
<body>
<div class="page">
    <div class="page-wrapper">
        <div class="container-xl py-4">
            <h1 class="mb-4">Центр управления заявками</h1>
            {% csrf_token %}
            <div id="message" role="status" aria-live="polite"></div>

            <!-- Форма создания заявки -->
            <div class="card mb-4">
                <div class="card-body">
                    <form id="ticket-form">
                        <div class="mb-3">
                            <label class="form-label">Название заявки</label>
                            <input id="title" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Категория</label>
                            <select id="category" class="form-select" required></select>
                        </div>
                        <button class="btn btn-primary" type="submit">Создать заявку</button>
                    </form>
                </div>
            </div>

            <!-- Блок списка и фильтрации -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Список заявок</h2>
                </div>
                <div class="card-body">
                    <select id="status-filter" class="form-select mb-3">
                        <option value="">Все статусы</option>
                        <option value="new">Новые</option>
                        <option value="progress">В работе</option>
                        <option value="done">Выполненные</option>
                    </select>
                    <div id="loading" hidden>Загрузка данных...</div>
                    <div id="tickets-list"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal modal-blur fade" id="statusModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Изменить статус заявки</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Скрытое поле для ID выбранной заявки -->
                <input type="hidden" id="modal-ticket-id">
                <label class="form-label">Выберите новый статус</label>
                <select id="modal-status-select" class="form-select">
                    <option value="new">Новая</option>
                    <option value="progress">В работе</option>
                    <option value="done">Выполнена</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link link-secondary me-auto" data-bs-dismiss="modal">Отмена</button>
                <button type="button" id="save-status-btn" class="btn btn-primary">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script src="https://jsdelivr.net"></script>
<script src="{% static 'tickets/app.js' %}"></script>
</body>
</html>
