{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-12 col-md-10 col-lg-8">

        <div class="card">

            <div class="card-header">
                <h2 class="card-title">
                    {{ title }}
                </h2>
            </div>

            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="mt-4">

                        <button class="btn btn-primary"
                                type="submit">
                            Сохранить
                        </button>

                        <a class="btn btn-secondary"
                           href="javascript:history.back()">
                            Отмена
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
