<div class="col-sm-6 col-lg-3">
    <div class="card">
        <div class="card-body">
            <div class="d-flex align-items-center">
                {% if icon %}
                <div class="me-3">
                    <span class="bg-{{ color|default:'blue' }}-lt text-{{ color|default:'blue' }} avatar avatar-lg rounded">
                        <i class="ti ti-{{ icon }} fs-2"></i>
                    </span>
                </div>
                {% endif %}
                <div class="flex-fill">
                    <div class="subheader">{{ label }}</div>
                    <div class="h1 mb-0">{{ value }}</div>
                </div>
            </div>
        </div>
    </div>
</div>
